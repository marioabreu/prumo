enum EstadoDespesa { POR_REVER CONFIRMADA ADIADA }
enum OrigemDespesa { UPLOAD EMAIL }

type CentroCusto {
  id: ID!
  nome: String!
  ativa: Boolean!
}

type Fornecedor {
  id: ID!
  nif: String!
  nome: String
  morada: String
}

type Utilizador {
  id: ID!
  nome: String!
  email: String!
}

type Tarefa {
  id: ID!
  texto: String!
  feita: Boolean!
  criadaEm: String!
}

type Funcionalidade {
  id: ID!
  chave: String!
  nome: String!
  ativa: Boolean!
}

type RotulosCentroCusto {
  singular: String!
  plural: String!
}

type Despesa {
  id: ID!
  nifFornecedor: String!
  fornecedor: Fornecedor
  numeroFatura: String!
  dataFatura: String!
  baseTributavel: String!
  valorIva: String!
  valorTotal: String!
  ficheiroUrl: String!
  qrRaw: String
  origem: OrigemDespesa!
  centroCusto: CentroCusto
  estado: EstadoDespesa!
  lockPorId: String
  lockExpiraEm: String
}

type SugestaoCentroCusto {
  centroCustoId: ID!
  motivo: String!
  score: Float!
}

type TotalCentroCusto {
  centroCusto: CentroCusto!
  total: String!
}

type IngerirFaturaResultado {
  despesa: Despesa!
  duplicada: Boolean!
}

input AtualizarValoresInput {
  baseTributavel: String
  valorIva: String
  valorTotal: String
}

input CriarCentroCustoInput {
  nome: String!
  ativa: Boolean
}

input AtualizarCentroCustoInput {
  nome: String
  ativa: Boolean
}

input CriarFornecedorInput {
  nif: String!
  nome: String
  morada: String
}

input AtualizarFornecedorInput {
  nif: String
  nome: String
  morada: String
}

input CriarUtilizadorInput {
  nome: String!
  email: String!
}

input AtualizarUtilizadorInput {
  nome: String
  email: String
}

input CriarTarefaInput {
  texto: String!
}

input AtualizarTarefaInput {
  texto: String
  feita: Boolean
}

type Query {
  filaRevisao(estado: EstadoDespesa): [Despesa!]!
  despesas(estado: EstadoDespesa, centroCustoId: ID): [Despesa!]!
  despesa(id: ID!): Despesa
  sugestaoCentroCusto(despesaId: ID!): SugestaoCentroCusto
  totaisPorCentroCusto: [TotalCentroCusto!]!
  centrosCusto: [CentroCusto!]!
  fornecedores: [Fornecedor!]!
  utilizadores: [Utilizador!]!
  tarefas: [Tarefa!]!
  funcionalidades: [Funcionalidade!]!
  rotulosCentroCusto: RotulosCentroCusto!
}

type Mutation {
  ingerirFatura(ficheiroUrl: String!, qrRaw: String): IngerirFaturaResultado!
  bloquear(despesaId: ID!, utilizadorId: ID!): Despesa!
  atribuirCentroCusto(despesaId: ID!, centroCustoId: ID!): Despesa!
  atualizarValores(despesaId: ID!, input: AtualizarValoresInput!): Despesa!
  confirmar(despesaId: ID!): Despesa!
  adiar(despesaId: ID!): Despesa!

  criarCentroCusto(input: CriarCentroCustoInput!): CentroCusto!
  atualizarCentroCusto(id: ID!, input: AtualizarCentroCustoInput!): CentroCusto!
  eliminarCentroCusto(id: ID!): Boolean!

  criarFornecedor(input: CriarFornecedorInput!): Fornecedor!
  atualizarFornecedor(id: ID!, input: AtualizarFornecedorInput!): Fornecedor!
  eliminarFornecedor(id: ID!): Boolean!

  criarUtilizador(input: CriarUtilizadorInput!): Utilizador!
  atualizarUtilizador(id: ID!, input: AtualizarUtilizadorInput!): Utilizador!
  eliminarUtilizador(id: ID!): Boolean!

  criarTarefa(input: CriarTarefaInput!): Tarefa!
  atualizarTarefa(id: ID!, input: AtualizarTarefaInput!): Tarefa!
  eliminarTarefa(id: ID!): Boolean!
  eliminarTarefasFeitas: Int!

  atualizarFuncionalidade(chave: String!, ativa: Boolean!): Funcionalidade!
  atualizarRotulosCentroCusto(singular: String!, plural: String!): RotulosCentroCusto!
}

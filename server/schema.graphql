enum EstadoDespesa { POR_REVER CONFIRMADA ADIADA }
enum OrigemDespesa { UPLOAD EMAIL }

type Obra {
  id: ID!
  nome: String!
  ativa: Boolean!
}

type Fornecedor {
  id: ID!
  nif: String!
  nome: String
  morada: String
}

type Utilizador {
  id: ID!
  nome: String!
  email: String!
}

type Tarefa {
  id: ID!
  texto: String!
  feita: Boolean!
  criadaEm: String!
}

type Despesa {
  id: ID!
  nifFornecedor: String!
  fornecedor: Fornecedor
  numeroFatura: String!
  dataFatura: String!
  baseTributavel: String!
  valorIva: String!
  valorTotal: String!
  ficheiroUrl: String!
  qrRaw: String
  origem: OrigemDespesa!
  obra: Obra
  estado: EstadoDespesa!
  lockPorId: String
  lockExpiraEm: String
}

type SugestaoObra {
  obraId: ID!
  motivo: String!
  score: Float!
}

type TotalObra {
  obra: Obra!
  total: String!
}

type IngerirFaturaResultado {
  despesa: Despesa!
  duplicada: Boolean!
}

input AtualizarValoresInput {
  baseTributavel: String
  valorIva: String
  valorTotal: String
}

input CriarObraInput {
  nome: String!
  ativa: Boolean
}

input AtualizarObraInput {
  nome: String
  ativa: Boolean
}

input CriarFornecedorInput {
  nif: String!
  nome: String
  morada: String
}

input AtualizarFornecedorInput {
  nif: String
  nome: String
  morada: String
}

input CriarUtilizadorInput {
  nome: String!
  email: String!
}

input AtualizarUtilizadorInput {
  nome: String
  email: String
}

input CriarTarefaInput {
  texto: String!
}

input AtualizarTarefaInput {
  texto: String
  feita: Boolean
}

type Query {
  filaRevisao(estado: EstadoDespesa): [Despesa!]!
  despesas(estado: EstadoDespesa, obraId: ID): [Despesa!]!
  despesa(id: ID!): Despesa
  sugestaoObra(despesaId: ID!): SugestaoObra
  totaisPorObra: [TotalObra!]!
  obras: [Obra!]!
  fornecedores: [Fornecedor!]!
  utilizadores: [Utilizador!]!
  tarefas: [Tarefa!]!
}

type Mutation {
  ingerirFatura(ficheiroUrl: String!, qrRaw: String): IngerirFaturaResultado!
  bloquear(despesaId: ID!, utilizadorId: ID!): Despesa!
  atribuirObra(despesaId: ID!, obraId: ID!): Despesa!
  atualizarValores(despesaId: ID!, input: AtualizarValoresInput!): Despesa!
  confirmar(despesaId: ID!): Despesa!
  adiar(despesaId: ID!): Despesa!

  criarObra(input: CriarObraInput!): Obra!
  atualizarObra(id: ID!, input: AtualizarObraInput!): Obra!
  eliminarObra(id: ID!): Boolean!

  criarFornecedor(input: CriarFornecedorInput!): Fornecedor!
  atualizarFornecedor(id: ID!, input: AtualizarFornecedorInput!): Fornecedor!
  eliminarFornecedor(id: ID!): Boolean!

  criarUtilizador(input: CriarUtilizadorInput!): Utilizador!
  atualizarUtilizador(id: ID!, input: AtualizarUtilizadorInput!): Utilizador!
  eliminarUtilizador(id: ID!): Boolean!

  criarTarefa(input: CriarTarefaInput!): Tarefa!
  atualizarTarefa(id: ID!, input: AtualizarTarefaInput!): Tarefa!
  eliminarTarefa(id: ID!): Boolean!
  eliminarTarefasFeitas: Int!
}

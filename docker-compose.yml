name: prumo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prumo
      POSTGRES_PASSWORD: prumo
      POSTGRES_DB: prumo
    ports:
      - "5433:5432" # 5432 conflicts with a native local Postgres install on this machine
    volumes:
      - prumo-db:/var/lib/postgresql/data
volumes:
  prumo-db:
